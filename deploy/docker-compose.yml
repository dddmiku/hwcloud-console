# hwcloud 控制台 —— 一条命令启动
#
#   docker compose up -d
#
# 首次启动后打开 http://<服务器IP>:8899 ，会引导你创建管理员账号。
#
# ── 升级不会丢数据 ──
# 所有可变数据都映射到宿主机的 ./data-runtime/ 下，容器只是运行载体。
# 升级步骤：
#   docker compose pull      # 拉新镜像
#   docker compose up -d     # 重建容器（数据卷原样保留）
# 删容器、换镜像、重建都不影响 data-runtime 里的内容。
# 只有手动 rm -rf data-runtime 才会真正丢数据。
#
# ── 华为云自动登录 ──
# Camoufox 浏览器（约 2.4 GB）**已内置在镜像里**，不用自己装。
# 首次启动时 entrypoint 会把它从镜像复制到 ./data-runtime/camoufox/，
# 之后容器重启直接复用，镜像升级也不会冲掉。
#
# ── 打码服务（可选） ──
# 云实验 / GitCode 登录遇到滑块时需要打码服务算缺口位置。
# 不配的话滑块相关任务会报「未配置打码服务」，签到、发文章、
# Star、提 Issue 这些纯 HTTP 任务不受影响。
# 服务地址和凭据在源码里不再硬编码，全部从环境变量读。

services:
  hwcloud:
    image: ghcr.io/dddmiku/hwcloud-console:latest
    # 想本地构建时把上面这行注释掉、取消下面三行的注释：
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: hwcloud
    restart: unless-stopped

    ports:
      # 默认只监听本机，避免面板直接暴露到公网。
      # 需要远程访问时改成 "8899:8899"（去掉 127.0.0.1:），
      # 并且**务必**先设一个强密码。
      - "127.0.0.1:8899:8899"

    environment:
      TZ: Asia/Shanghai
      # 需要人工过 GitCode 验证码时设置，会在容器内起 x11vnc（端口 5901）。
      # 设置后记得把 5901 也映射出来，或者用 SSH 隧道。
      # VNC_PASSWORD: "换成你的密码"

      # ── 打码服务（可选，过滑块用）──
      # 四项都配齐才生效；缺 BASE 或 KEY 时滑块功能直接返回「未配置」。
      #
      # 推荐写在同目录的 .env 里（compose 会自动读取），
      # 这样密码不会进 git：
      #   cp .env.example .env
      #   vim .env
      #
      # 下面用 ${VAR:-} 引用，.env 没配时传空字符串，等于不启用。
      HWCLOUD_CAPTCHA_BASE: "${HWCLOUD_CAPTCHA_BASE:-}"
      HWCLOUD_CAPTCHA_KEY:  "${HWCLOUD_CAPTCHA_KEY:-}"
      HWCLOUD_CAPTCHA_USER: "${HWCLOUD_CAPTCHA_USER:-}"
      HWCLOUD_CAPTCHA_PASS: "${HWCLOUD_CAPTCHA_PASS:-}"

    volumes:
      # 账号、会话、日志 —— 全部映射到本地，镜像升级不影响
      - ./data-runtime/accounts:/opt/hwcloud-demo/accounts
      - ./data-runtime/state:/opt/hwcloud-demo/state
      - ./data-runtime/logs:/opt/hwcloud-demo/logs
      # Camoufox 浏览器（用户自己装在这里），镜像升级不影响
      - ./data-runtime/camoufox:/opt/hwcloud-demo/camoufox

    # 浏览器任务吃内存（每个 Chromium 约 200-400 MB），
    # 1 GB 的机器建议加 swap，或者调低下面的上限
    shm_size: 1gb
    deploy:
      resources:
        limits:
          memory: 4g

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8899/api/auth/state"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
